<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPREMO Mean Reversion 4H</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;background:#0b1017;color:#e8eef7;margin:0;padding:18px}
h1{font-size:34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:#111923;border:1px solid #2a394a;border-radius:16px;padding:18px;margin:12px 0}
.signal{font-size:24px;font-weight:800;margin-bottom:15px}.buy{color:#4ade80}.sell{color:#fb7185}.wait{color:#fbbf24}.muted{color:#94a3b8}
.row{display:flex;justify-content:space-between;margin:9px 0}.small{font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<h1>SUPREMO · Mean Reversion 4H</h1>
<div class="card">
<b>PAPER</b> · BTC/USDT + ETH/USDT · 4H · RSI Wilder(14) · Bollinger(20,2)<br>
<b>COMPRA:</b> RSI &lt; 30 Y precio actual ≤ BB inferior<br>
<b>VENTA:</b> RSI &gt; 60 O precio actual ≥ SMA20<br>
<b>Stop:</b> 4% · <b>Posición:</b> máximo 5%
</div>
<div id="app">Cargando…</div>

<script>
function esc(v){
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function load(){
  try{
    var s=await (await fetch("/status",{cache:"no-store"})).json();
    var h='<div class="grid">';

    ["BTCUSDT","ETHUSDT"].forEach(function(symbol){
      var x=s.market[symbol];

      if(!x){
        h+='<div class="card"><h2>'+symbol+'</h2><p class="muted">Esperando datos…</p></div>';
        return;
      }

      if(x.error){
        h+='<div class="card"><h2>'+symbol+'</h2><p class="sell">'+esc(x.error)+'</p></div>';
        return;
      }

      var cls=x.signal==="BUY"?"buy":(x.signal==="OVERBOUGHT"||x.signal==="SELL"||x.signal==="STOP"?"sell":"wait");
      var label=x.signal==="BUY"?"SEÑAL DE COMPRA":
        (x.signal==="SELL"?"SEÑAL DE VENTA":
        (x.signal==="OVERBOUGHT"?"CONDICIÓN DE VENTA · SIN POSICIÓN":
        (x.signal==="STOP"?"STOP-LOSS":"ESPERAR")));

      h+='<div class="card">';
      h+='<h2>'+symbol+'</h2>';
      h+='<div class="signal '+cls+'">'+label+'</div>';
      h+='<div class="row"><span>Precio actual</span><b>'+x.price.toFixed(2)+'</b></div>';
      h+='<div class="row"><span>RSI Wilder(14)</span><b>'+x.rsi.toFixed(2)+'</b></div>';
      h+='<div class="row"><span>BB superior</span><span>'+x.upper.toFixed(2)+'</span></div>';
      h+='<div class="row"><span>BB media SMA20</span><span>'+x.middle.toFixed(2)+'</span></div>';
      h+='<div class="row"><span>BB inferior</span><span>'+x.lower.toFixed(2)+'</span></div>';
      h+='<div class="row"><span>Distancia BB inferior</span><span>'+x.distanceLowerPct.toFixed(2)+'%</span></div>';
      h+='<div class="row"><span>Distancia SMA20</span><span>'+x.distanceMiddlePct.toFixed(2)+'%</span></div>';

      if(x.position){
        h+='<p><b>Posición PAPER:</b> entrada '+x.position.entry.toFixed(2)+' · stop '+x.position.stop.toFixed(2)+'</p>';
      }

      h+='<p class="small">RSI y Bollinger: última vela 4H cerrada · Precio: ticker actual<br>'+esc(x.candleTime)+'</p>';
      h+='</div>';
    });

    h+='</div>';
    h+='<div class="card"><b>Estado:</b> '+esc(s.status)+
      ' · <b>Equity:</b> '+Number(s.equity).toFixed(2)+
      ' · <b>PnL realizado:</b> '+Number(s.realizedPnl).toFixed(2)+
      ' · <b>Flotante:</b> '+Number(s.floatingPnl).toFixed(2)+
      '<br><span class="small">Scans: '+s.scans+' · '+esc(s.lastScan||"")+'</span></div>';

    document.getElementById("app").innerHTML=h;
  }catch(e){
    document.getElementById("app").innerHTML='<div class="card sell">Error: '+esc(e.message)+'</div>';
  }
}

load();
setInterval(load,5000);
</script>
</body>
</html>
